syntax = "proto3";
package WithXR.Proto;

import "baseapi/BaseNetworkTypes.proto";

option java_package = "org.withXR.network.v3.microscopeApi";
option java_outer_classname = "ClientSignals";
option java_multiple_files = true;

message MicroscopeControlSignal {
  oneof signal{
    Live live = 1;
    MoveStage moveStage = 2;
    Shutdown shutdown = 4;
    SnapImage snapImage = 5;
    AcquireStack acquireStack = 6;
    Stop stop = 7;
    AblationPoints ablationPoints = 8;
    AblationShutter ablationShutter = 9;
    StartAcquisition startAcquisition = 10;
    DeviceSpecific deviceSpecific = 11;
  }
}
message Live {}
message MoveStage {
  baseapi.Vector3Float target = 1;
}
message Shutdown {}
message SnapImage {}
message AcquireStack{
  baseapi.Vector3Float startPosition = 1;
  baseapi.Vector3Float endPosition = 2;
  float stepSize = 3;
  bool live = 4;
  baseapi.Vector2Int roiStart = 5;
  baseapi.Vector2Int roiEnd = 6;
  int32 id = 7;
}
message Stop {};
message AblationPoints{
  repeated AblationPoint points = 2;
  int64 dwellTime = 1;
  float laserPower = 3;
}
message AblationPoint{
  baseapi.Vector3Float position = 1;
  // in millis
  int64 dwellTime = 2;
  bool laserOn = 3;
  bool laserOff = 4;
  float laserPower = 5;
  bool countMoveTime = 6;
}
message AblationShutter{
  bool open = 1;
}
message StartAcquisition{};
message DeviceSpecific{
  bytes data = 1;
}


