syntax = "proto3";
package viewerapi;

import "baseapi/BaseNetworkTypes.proto";

option java_package = "org.withXR.network.v3.viewerApi";
option java_outer_classname = "ViewerControlSignals";
option java_multiple_files = true;

// ------- Client Signals ---------

message ViewerControlSignal{
  oneof signal{
    Segmentation segmentation = 1;
    RequestStack requestStack = 2;
  }
}

message Segmentation{
  repeated baseapi.Vector3Float foreground = 1;
  repeated baseapi.Vector3Float background = 2;
  int32 onId = 3;
}

message RequestStack{
  int32 id = 1;
}

// ------- Server Signals ---------

message ViewerSignal{
  oneof signal{
    SelectedStack selectedStack = 1;
    NewHyperStack newHyperStack = 2;
  }
}

message SelectedStack{
  int32 hyperStackId = 1;
  int32 timePointIndex = 2;
}

message NewHyperStack{
  int32 id = 1;
  string name = 2;
  repeated int32 timepointStackIds = 3;
}